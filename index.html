<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地下勘探 III · 关卡测试版</title>
<style>
  :root {
    --bg-page: #1a1a18;
    --bg-board: #2C2C2A;
    --bg-dark: #2C2C2A;
    --bg-dark-in-ring: #3C3C39;
    --bg-lit-empty: #F1EFE8;
    --bg-lit-walked: #B4B2A9;
    --bg-lit-lava: #F7C1C1;
    --bg-lit-lava-walked: #F09595;
    --bg-entrance-exit: #9FE1CB;
    --bg-exit-dark: #0F6E56;
    --bg-pickaxe: #FAEEDA;
    --text-primary: #F1EFE8;
    --text-secondary: #B4B2A9;
    --text-tertiary: #888780;
    --border-dark: #444441;
    --border-ring: #BA7517;
    --border-player: #042C53;
    --color-lava: #E24B4A;
    --color-zero: #888780;
    --color-flag: #E24B4A;
    --color-check: #1D9E75;
    --color-question: #BA7517;
    --color-flag-dark: #F09595;
    --color-check-dark: #9FE1CB;
    --color-question-dark: #FAC775;
    --color-entrance: #085041;
    --color-pickaxe: #BA7517;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-tertiary);
    margin: 0 0 20px;
  }

  button {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 14px;
    background: transparent;
    color: var(--text-primary);
    border: 0.5px solid var(--text-tertiary);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
  }
  button:hover { background: var(--border-dark); }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .mode-btn {
    padding: 8px 18px;
    font-size: 14px;
    border-radius: 20px;
    border: 1px solid var(--border-dark);
    background: var(--bg-board);
    color: var(--text-tertiary);
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: var(--text-primary);
    color: var(--bg-page);
    border-color: var(--text-primary);
  }
  .mode-btn:hover:not(.active) {
    background: #3a3a37;
    color: var(--text-secondary);
  }

  /* Tutorial modal */
  #tutorial-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #tutorial-overlay.show { display: flex; }
  #tutorial-card {
    background: #25251F;
    border: 1px solid var(--border-dark);
    border-radius: 12px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    color: var(--text-primary);
    line-height: 1.6;
    font-size: 14px;
    max-height: 90vh;
    overflow-y: auto;
  }
  #tutorial-card h2 {
    margin: 0 0 16px;
    font-size: 18px;
    font-weight: 500;
  }
  #tutorial-card .tut-item {
    margin-bottom: 12px;
  }
  #tutorial-card .tut-icon {
    display: inline-block;
    margin-right: 6px;
  }
  #tutorial-card .tut-key {
    font-weight: 500;
    color: var(--text-primary);
  }
  #tutorial-card .tut-body {
    color: var(--text-secondary);
    margin-top: 2px;
    padding-left: 22px;
    font-size: 13px;
  }
  #tutorial-card .tut-highlight-red { color: #F09595; font-weight: 500; }
  #tutorial-card .tut-highlight-amber { color: #FAC775; font-weight: 500; }
  #tutorial-card .tut-highlight-lava { color: #F09595; font-weight: 500; }
  #tutorial-card .tut-btn {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    font-size: 15px;
    background: var(--text-primary);
    color: var(--bg-page);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
  }
  #tutorial-card .tut-btn:hover {
    background: #FAC775;
  }

  /* ----- Level select screen ----- */
  #level-select {
    max-width: 560px;
    width: 100%;
  }

  .chapter {
    margin-bottom: 24px;
  }
  .chapter-title {
    font-size: 16px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    font-weight: 500;
  }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }

  .level-card {
    background: var(--bg-board);
    border: 1px solid var(--border-dark);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .level-card:hover:not(.locked) { background: #3a3a37; }
  .level-card.locked { opacity: 0.4; cursor: not-allowed; }
  .level-card.cleared { border-color: #1D9E75; }

  .level-card .level-num {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
  }
  .level-card .level-desc {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 4px;
    line-height: 1.4;
  }
  .level-card .level-status {
    margin-top: 6px;
    font-size: 11px;
  }
  .level-card.cleared .level-status { color: #9FE1CB; }
  .level-card.locked .level-status { color: var(--text-tertiary); }

  /* ----- Game screen ----- */
  #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 720px;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .info {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .info .label { color: var(--text-primary); font-weight: 500; }
  .info .pickaxe-owned { color: var(--color-pickaxe); font-weight: 500; }

  #status {
    font-size: 13px;
    color: var(--text-secondary);
    min-height: 18px;
    margin-bottom: 10px;
    text-align: center;
  }
  #status.danger { color: #F09595; }
  #status.success { color: #9FE1CB; }
  #status.info { color: #B5D4F4; }
  #status.warning { color: #FAC775; }

  #board-container {
    display: inline-block;
    background: var(--bg-board);
    padding: 8px;
    border-radius: 8px;
    max-width: 100%;
    overflow: auto;
  }

  #grid {
    display: grid;
    gap: 2px;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    border-radius: 3px;
    user-select: none;
    transition: background 0.1s;
    box-sizing: border-box;
    border: 0.5px solid var(--border-dark);
    background: var(--bg-dark);
    position: relative;
  }
  .cell.can-step { cursor: pointer; }
  .cell.can-step:hover { background: #FAC775 !important; }

  .legend {
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-tertiary);
    line-height: 1.7;
    text-align: center;
    max-width: 720px;
  }
  .legend strong { color: var(--text-secondary); font-weight: 500; }
</style>
</head>
<body>

<h1>地下勘探</h1>
<p class="subtitle">关卡测试版</p>

<!-- Level Select Screen -->
<div id="level-select">
  <div class="chapter">
    <div class="chapter-title">章节一 · 勘探入门</div>
    <div class="level-grid" id="ch1-grid"></div>
  </div>
  <div class="chapter">
    <div class="chapter-title">章节二 · 地下深入</div>
    <div class="level-grid" id="ch2-grid"></div>
  </div>
  <div style="margin-top: 20px; font-size: 12px; color: var(--text-tertiary); text-align: center;">
    <button id="reset-progress-btn" style="font-size: 11px;">清除所有进度</button>
  </div>
</div>

<!-- Game Screen -->
<div id="game-screen">
  <div class="top-bar">
    <div class="info">
      <button id="back-btn">← 关卡选择</button>
      <span id="level-label">关卡</span>
      <span id="objective">步数 · 0</span>
      <span id="pickaxe-status"></span>
    </div>
    <div>
      <button id="reset-btn">重玩</button>
    </div>
  </div>

  <div id="status">点击顶部发光的入口进入。</div>

  <div id="board-container">
    <div id="grid"></div>
  </div>

  <div id="mode-bar" style="margin-top: 12px; display: flex; gap: 8px; justify-content: center;">
    <button id="mode-move-btn" class="mode-btn active">🚶 移动</button>
    <button id="mode-flag-btn" class="mode-btn">⚑ 标记</button>
  </div>

  <div class="legend" id="legend-text">
    <div><strong>左键</strong> 相邻格 = 移动 · <strong>右键</strong> 任意格 = 标记（无 → 旗 → 问号 → 勾 → 无）</div>
  </div>
</div>

<!-- Tutorial modal -->
<div id="tutorial-overlay">
  <div id="tutorial-card">
    <h2 id="tutorial-title">教程</h2>
    <div id="tutorial-items"></div>
    <button class="tut-btn" id="tutorial-close-btn">开始挑战</button>
  </div>
</div>

<script>
(function() {
  // ============================================================
  // Level definitions
  // ============================================================
  // monsterType: '4dir' | '8dir' | 'diag' | 'hidden'
  // monsters: array of {type} (one entry per monster)
  const LEVELS = [
    // ===== Chapter 1: 10x10, monster type intro =====
    {
      id: '1-1', chapter: 1, name: '关卡 1-1',
      desc: '勘探初探 · 10×10 · 无怪物',
      rows: 10, cols: 10, lava: 10,
      monsters: [], hasPickaxe: false,
    },
    {
      id: '1-2', chapter: 1, name: '关卡 1-2',
      desc: '怪物初遇 · 10×10 · 1 只 4 方向怪',
      rows: 10, cols: 10, lava: 10,
      monsters: [{ type: '4dir' }], hasPickaxe: true,
    },
    {
      id: '1-3', chapter: 1, name: '关卡 1-3',
      desc: '对称强敌 · 10×10 · 1 只 8 方向怪',
      rows: 10, cols: 10, lava: 14,
      monsters: [{ type: '8dir' }], hasPickaxe: true,
    },
    {
      id: '1-4', chapter: 1, name: '关卡 1-4',
      desc: '诡异步伐 · 10×10 · 1 只斜角怪',
      rows: 10, cols: 10, lava: 14,
      monsters: [{ type: 'diag' }], hasPickaxe: true,
    },
    {
      id: '1-5', chapter: 1, name: '关卡 1-5',
      desc: '幽影 · 10×10 · 1 只隐身怪',
      rows: 10, cols: 10, lava: 14,
      monsters: [{ type: 'hidden' }], hasPickaxe: true,
    },
    // ===== Chapter 2: 15x15, two-monster combinations =====
    {
      id: '2-1', chapter: 2, name: '关卡 2-1',
      desc: '双怪入门 · 15×15 · 4 方向 × 2',
      rows: 15, cols: 15, lava: 28,
      monsters: [{ type: '4dir' }, { type: '4dir' }], hasPickaxe: true,
    },
    {
      id: '2-2', chapter: 2, name: '关卡 2-2',
      desc: '速度差 · 15×15 · 4 方向 + 8 方向',
      rows: 15, cols: 15, lava: 30,
      monsters: [{ type: '4dir' }, { type: '8dir' }], hasPickaxe: true,
    },
    {
      id: '2-3', chapter: 2, name: '关卡 2-3',
      desc: '互补包抄 · 15×15 · 4 方向 + 斜角',
      rows: 15, cols: 15, lava: 30,
      monsters: [{ type: '4dir' }, { type: 'diag' }], hasPickaxe: true,
    },
    {
      id: '2-4', chapter: 2, name: '关卡 2-4',
      desc: '极限机动 · 15×15 · 8 方向 + 斜角',
      rows: 15, cols: 15, lava: 30,
      monsters: [{ type: '8dir' }, { type: 'diag' }], hasPickaxe: true,
    },
    {
      id: '2-5', chapter: 2, name: '关卡 2-5',
      desc: '可见与不可见 · 15×15 · 4 方向 + 隐身',
      rows: 15, cols: 15, lava: 30,
      monsters: [{ type: '4dir' }, { type: 'hidden' }], hasPickaxe: true,
    },
    {
      id: '2-6', chapter: 2, name: '关卡 2-6',
      desc: '高速 + 幽影 · 15×15 · 8 方向 + 隐身',
      rows: 15, cols: 15, lava: 30,
      monsters: [{ type: '8dir' }, { type: 'hidden' }], hasPickaxe: true,
    },
    {
      id: '2-7', chapter: 2, name: '关卡 2-7',
      desc: '双重幽影 · 15×15 · 隐身 × 2',
      rows: 15, cols: 15, lava: 30,
      monsters: [{ type: 'hidden' }, { type: 'hidden' }], hasPickaxe: true,
    },
  ];

  // ============================================================
  // Tutorial config
  // ============================================================
  // Each tutorial: id (unique), levelId (when to trigger), title, items[]
  // items: { icon, key, body (HTML allowed) }
  const TUTORIALS = [
    {
      id: 'intro',
      levelId: '1-1',
      title: '欢迎来到矿洞',
      items: [
        { icon: '🎯', key: '目标', body: '从顶部入口走到底部出口' },
        { icon: '🚶', key: '怎么走', body: '点击玩家周围 8 格中的任意一格,移动过去' },
        { icon: '🔥', key: '危险', body: '地图里藏着 <span class="tut-highlight-lava">岩浆</span>,踩到 = 死' },
        { icon: '💡', key: '怎么避开岩浆', body: '踩入<span class="tut-highlight-amber">暗格</span>后,会照亮以这格为中心的 3×3 区域。空地上的<span class="tut-highlight-red">红色数字</span>告诉你"以这格为中心的 8 格里有几个岩浆"。通过数字推断岩浆位置,绕开它们' },
        { icon: '✨', key: '决策圈', body: '<span class="tut-highlight-amber">橙色虚线</span>圈出来的范围是你下一步可能照亮的新区域。踩已照亮的格子只是移动位置,不会照亮新区域' },
      ],
    },
    {
      id: 'monsters',
      levelId: '1-2',
      title: '矿洞深处有怪物',
      items: [
        { icon: '👹', key: '怪物登场', body: '从这一关开始,地图里会出现 <span class="tut-highlight-amber">怪物</span>(场上的彩色图标)。碰到怪物 = 死' },
        { icon: '⏱', key: '它和你同步移动', body: '你每动 1 步,怪物也动 1 步。原地不动等于它也不动——你有充分的时间思考' },
        { icon: '🧭', key: '不同的怪物行为不同', body: '不同种类的怪物移动规则不一样,玩到时你会发现它们的特点。本关的怪物图标会显示在底部说明里' },
        { icon: '⛏', key: '镐子', body: '地图上有一把 <span class="tut-highlight-amber">镐子</span>(⛏ 图标)。拾取后,下一次相邻碰到怪物会自动击杀它,镐子消耗。一关只有一把,要不要拿、用在哪只怪物上,自己决定' },
      ],
    },
  ];

  // ============================================================
  // Progress (localStorage)
  // ============================================================
  function getProgress() {
    try {
      const raw = localStorage.getItem('miner_progress_v3');
      if (!raw) return { cleared: [] };
      return JSON.parse(raw);
    } catch (e) {
      return { cleared: [] };
    }
  }
  function saveProgress(p) {
    try { localStorage.setItem('miner_progress_v3', JSON.stringify(p)); } catch (e) {}
  }
  function isCleared(id) { return getProgress().cleared.includes(id); }
  function markCleared(id) {
    const p = getProgress();
    if (!p.cleared.includes(id)) p.cleared.push(id);
    saveProgress(p);
  }
  function isUnlocked(id) {
    // first level always unlocked. each subsequent level unlocks after the previous is cleared
    const idx = LEVELS.findIndex(L => L.id === id);
    if (idx === 0) return true;
    return isCleared(LEVELS[idx - 1].id);
  }

  // ============================================================
  // Render level select
  // ============================================================
  function renderLevelSelect() {
    const ch1 = document.getElementById('ch1-grid');
    const ch2 = document.getElementById('ch2-grid');
    ch1.innerHTML = '';
    ch2.innerHTML = '';
    for (const L of LEVELS) {
      const card = document.createElement('div');
      card.className = 'level-card';
      const cleared = isCleared(L.id);
      const unlocked = isUnlocked(L.id);
      if (!unlocked) card.classList.add('locked');
      if (cleared) card.classList.add('cleared');
      card.innerHTML =
        '<div class="level-num">' + L.name + '</div>' +
        '<div class="level-desc">' + L.desc + '</div>' +
        '<div class="level-status">' +
          (cleared ? '✓ 已通过' : (unlocked ? '可挑战' : '未解锁')) +
        '</div>';
      if (unlocked) {
        card.addEventListener('click', () => loadLevel(L.id));
      }
      (L.chapter === 1 ? ch1 : ch2).appendChild(card);
    }
  }

  // ============================================================
  // Game state
  // ============================================================
  let currentLevel = null;
  let ROWS, COLS, LAVA_COUNT;
  let board = [];          // 'empty' | 'lava' | 'pickaxe'
  let walked = [];
  let everLit = [];
  let flags = [];
  let entranceR = 0, entranceC = -1;
  let exitR = -1, exitC = -1;
  let playerR = -1, playerC = -1;
  let decisionR = -1, decisionC = -1;
  let monsters = [];        // {type, r, c, patrol, alert, lastDir}
  let pickaxeOwned = false;
  let pickaxePos = null;
  let gameOver = false;
  let firstMove = true;
  let steps = 0;
  let inputMode = 'move'; // 'move' | 'flag'

  const MONSTER_ALERT_RANGE = 4;

  // ============================================================
  // Helpers
  // ============================================================
  function makeEmpty() {
    board = Array.from({length: ROWS}, () => Array(COLS).fill('empty'));
    walked = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    everLit = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    flags = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    monsters = [];
    pickaxeOwned = false;
    pickaxePos = null;
  }

  function neighbors(r, c) {
    const out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) out.push([nr, nc]);
    }
    return out;
  }
  function neighbors4(r, c) {
    const out = [];
    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) out.push([nr, nc]);
    }
    return out;
  }
  function neighborsDiag(r, c) {
    const out = [];
    for (const [dr, dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) out.push([nr, nc]);
    }
    return out;
  }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
  }
  function chebyshev(r1, c1, r2, c2) { return Math.max(Math.abs(r1-r2), Math.abs(c1-c2)); }
  function manhattan(r1, c1, r2, c2) { return Math.abs(r1-r2) + Math.abs(c1-c2); }

  // ============================================================
  // Map generation
  // ============================================================
  function generateMap() {
    entranceC = Math.floor(Math.random() * COLS);
    exitC = Math.floor(Math.random() * COLS);
    exitR = ROWS - 1;

    const safePath = new Set();
    let curR = 0, curC = entranceC;
    safePath.add(curR + ',' + curC);
    while (curR < ROWS - 1) {
      curR++;
      const targetDir = Math.sign(exitC - curC);
      let dc;
      const rand = Math.random();
      if (rand < 0.55) dc = targetDir;
      else if (rand < 0.8) dc = 0;
      else dc = -targetDir;
      curC = Math.max(0, Math.min(COLS - 1, curC + dc));
      safePath.add(curR + ',' + curC);
    }
    if (curC !== exitC) {
      const dir = Math.sign(exitC - curC);
      while (curC !== exitC) {
        curC += dir;
        safePath.add((ROWS - 1) + ',' + curC);
      }
    }

    // Lava
    const lavaCandidates = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (safePath.has(r + ',' + c)) continue;
      lavaCandidates.push([r, c]);
    }
    shuffle(lavaCandidates);
    let lavaPlaced = 0;
    for (const [r, c] of lavaCandidates) {
      if (lavaPlaced >= LAVA_COUNT) break;
      board[r][c] = 'lava';
      lavaPlaced++;
    }

    // Monsters from level config
    const pathCells = Array.from(safePath).map(s => s.split(',').map(Number));
    const minRow = Math.max(2, Math.floor(ROWS * 0.2));
    const maxRow = ROWS - Math.max(2, Math.floor(ROWS * 0.15));
    const midPath = pathCells.filter(([r, c]) => r >= minRow && r <= maxRow);
    shuffle(midPath);
    let candIdx = 0;
    for (const monsterDef of currentLevel.monsters) {
      let placed = false;
      while (!placed && candIdx < midPath.length) {
        const [centerR, centerC] = midPath[candIdx];
        candIdx++;
        const patrol = new Set();
        for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
          const nr = centerR + dr, nc = centerC + dc;
          if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
          if (board[nr][nc] === 'lava') continue;
          if (nr === entranceR && nc === entranceC) continue;
          if (nr === exitR && nc === exitC) continue;
          let conflict = false;
          for (const ex of monsters) if (ex.patrol.has(nr + ',' + nc)) { conflict = true; break; }
          if (conflict) continue;
          patrol.add(nr + ',' + nc);
        }
        if (patrol.size < 4) continue;
        const validStarts = Array.from(patrol).filter(s => {
          const [sr, sc] = s.split(',').map(Number);
          return chebyshev(sr, sc, entranceR, entranceC) >= 3;
        });
        if (validStarts.length === 0) continue;
        const [sr, sc] = validStarts[Math.floor(Math.random() * validStarts.length)].split(',').map(Number);
        monsters.push({
          type: monsterDef.type,
          r: sr, c: sc,
          patrol: patrol,
          alert: false,
          lastDir: [0, 0]
        });
        placed = true;
      }
    }

    // Pickaxe
    if (currentLevel.hasPickaxe) {
      const goodPick = pathCells.filter(([r, c]) => {
        if (r < 2) return false; // not too close to entrance
        if (r === entranceR && c === entranceC) return false;
        if (r === exitR && c === exitC) return false; // don't spawn on the exit
        if (board[r][c] !== 'empty') return false;
        for (const m of monsters) if (m.r === r && m.c === c) return false;
        return true;
      });
      if (goodPick.length > 0) {
        const [pr, pc] = goodPick[Math.floor(Math.random() * goodPick.length)];
        board[pr][pc] = 'pickaxe';
        pickaxePos = [pr, pc];
      }
    }
  }

  // ============================================================
  // Lighting / decision ring
  // ============================================================
  function illuminate3x3(r, c) {
    everLit[r][c] = true;
    for (const [nr, nc] of neighbors(r, c)) everLit[nr][nc] = true;
  }
  function isLit(r, c) { return everLit[r][c]; }
  function countLavaAround(r, c) {
    let n = 0;
    for (const [nr, nc] of neighbors(r, c)) if (board[nr][nc] === 'lava') n++;
    return n;
  }
  function isInDecisionRing(r, c) {
    if (decisionR === -1) return false;
    const dr = Math.abs(r - decisionR), dc = Math.abs(c - decisionC);
    return dr <= 2 && dc <= 2 && (dr === 2 || dc === 2);
  }

  function canStepTo(r, c) {
    if (gameOver) return false;
    if (firstMove) return r === entranceR && c === entranceC;
    return Math.abs(r - playerR) <= 1 && Math.abs(c - playerC) <= 1 && !(r === playerR && c === playerC);
  }

  // ============================================================
  // Monster behavior - per type
  // ============================================================
  function getMonsterMoveOptions(monster) {
    const t = monster.type;
    if (t === 'diag') return neighborsDiag(monster.r, monster.c);
    if (t === '4dir' || t === 'hidden') return neighbors4(monster.r, monster.c);
    return neighbors(monster.r, monster.c); // '8dir'
  }
  function canMonsterEnter(r, c, self) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
    if (board[r][c] === 'lava') return false;
    for (const m of monsters) {
      if (m === self) continue;
      if (m.r === r && m.c === c) return false;
    }
    return true;
  }
  function moveMonster(m) {
    const distToPlayer = chebyshev(m.r, m.c, playerR, playerC);
    m.alert = distToPlayer <= MONSTER_ALERT_RANGE;
    const options = getMonsterMoveOptions(m).filter(([r, c]) => canMonsterEnter(r, c, m));
    if (options.length === 0) return;

    let candidates = [];
    if (m.alert) {
      // pick option(s) that reduce distance to player most
      const distFn = (m.type === '4dir' || m.type === 'hidden' || m.type === 'diag') ? manhattan : chebyshev;
      const curDist = distFn(m.r, m.c, playerR, playerC);
      let bestDist = Infinity;
      for (const [r, c] of options) {
        const d = distFn(r, c, playerR, playerC);
        if (d < bestDist) bestDist = d;
      }
      if (bestDist < curDist) {
        candidates = options.filter(([r, c]) => distFn(r, c, playerR, playerC) === bestDist);
      }
    }
    if (candidates.length === 0) {
      // patrol: random within patrol area, avoid backtrack
      candidates = options.filter(([r, c]) => {
        if (!m.patrol.has(r + ',' + c)) return false;
        if (r - m.r === -m.lastDir[0] && c - m.c === -m.lastDir[1]) return false;
        return true;
      });
      if (candidates.length === 0) {
        candidates = options.filter(([r, c]) => m.patrol.has(r + ',' + c));
      }
    }
    if (candidates.length === 0) candidates = options;
    const [nr, nc] = candidates[Math.floor(Math.random() * candidates.length)];
    m.lastDir = [nr - m.r, nc - m.c];
    m.r = nr; m.c = nc;
  }
  function moveMonsters() {
    for (const m of monsters) moveMonster(m);
  }

  function checkMonsterCollision() {
    for (let i = 0; i < monsters.length; i++) {
      const m = monsters[i];
      if (m.r === playerR && m.c === playerC) {
        if (pickaxeOwned) {
          pickaxeOwned = false;
          monsters.splice(i, 1);
          setStatus('⛏️ 你用镐子击杀了一只怪物！镐子已消耗。', 'success');
          return 'killed';
        } else {
          gameOver = true;
          revealAll();
          setStatus('💀 被怪物抓住了，死亡。', 'danger');
          return 'dead';
        }
      }
    }
    return null;
  }

  function isMonsterVisible(m) {
    if (m.type === 'hidden') {
      return isLit(m.r, m.c);
    }
    return true;
  }

  // ============================================================
  // Step / flag / etc.
  // ============================================================
  function step(r, c) {
    if (!canStepTo(r, c)) return;
    firstMove = false;
    playerR = r;
    playerC = c;
    if (!walked[r][c]) { walked[r][c] = true; steps++; }
    const wasAlreadyLit = isLit(r, c);
    if (!wasAlreadyLit) {
      illuminate3x3(r, c);
      decisionR = r;
      decisionC = c;
    }

    if (board[r][c] === 'lava') {
      gameOver = true;
      revealAll();
      setStatus('🔥 踩到岩浆，死亡。', 'danger');
      render();
      return;
    }
    if (board[r][c] === 'pickaxe') {
      pickaxeOwned = true;
      pickaxePos = null;
      board[r][c] = 'empty';
      setStatus('⛏️ 拾取了镐子。下次碰到怪物会自动击杀。', 'info');
    }
    const early = checkMonsterCollision();
    if (early === 'dead') { render(); return; }

    if (r === exitR && c === exitC) {
      gameOver = true;
      markCleared(currentLevel.id);
      setStatus('⛏️ 抵达出口！共走了 ' + steps + ' 步。该关卡已通过。', 'success');
      render();
      return;
    }

    moveMonsters();
    const late = checkMonsterCollision();
    if (late === 'dead') { render(); return; }

    if (late !== 'killed' && board[r][c] !== 'pickaxe') {
      const anyAlert = monsters.some(m => m.alert);
      if (anyAlert) {
        setStatus('第 ' + steps + ' 步：怪物正在靠近。', 'warning');
      } else if (wasAlreadyLit) {
        setStatus('第 ' + steps + ' 步：在已照亮区域内移动，未获得新信息。', 'secondary');
      } else {
        setStatus('第 ' + steps + ' 步：照亮了新的 3×3 区域。', 'info');
      }
    }
    render();
  }

  function cycleFlag(r, c) {
    if (gameOver || walked[r][c]) return;
    if (firstMove) return;
    flags[r][c] = (flags[r][c] + 1) % 4;
    render();
  }
  function revealAll() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) everLit[r][c] = true;
  }
  function setStatus(text, kind) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = kind || '';
  }

  // ============================================================
  // Render
  // ============================================================
  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    // size cell based on map size to keep total comfortable
    // Adaptive cell size: fit board into available viewport width
    // Account for: body padding (24px), board-container padding (16px), and gaps between cells
    const containerPadding = 16; // 8px on each side
    const bodyPadding = 24;      // 12px on each side
    const gapTotal = (COLS - 1) * 2; // 2px gap between cells
    const availableWidth = Math.min(window.innerWidth, 720) - bodyPadding - containerPadding - gapTotal;
    let cellSize = Math.floor(availableWidth / COLS);
    // Clamp to reasonable bounds
    if (cellSize < 18) cellSize = 18;   // floor for tappability
    if (cellSize > 36) cellSize = 36;   // ceiling so it doesn't look silly on desktop
    grid.style.gridTemplateColumns = 'repeat(' + COLS + ', ' + cellSize + 'px)';

    const fontSize = cellSize >= 26 ? 14 : (cellSize >= 20 ? 12 : 10);
    const iconSize = cellSize >= 26 ? 14 : (cellSize >= 20 ? 12 : 10);

    // Build a quick lookup for monsters
    const monsterMap = new Map();
    for (const m of monsters) {
      if (isMonsterVisible(m)) monsterMap.set(m.r + ',' + m.c, m);
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.width = cellSize + 'px';
        cell.style.height = cellSize + 'px';
        cell.style.fontSize = fontSize + 'px';

        const isPlayer = (r === playerR && c === playerC);
        const lit = isLit(r, c);
        const canStep = canStepTo(r, c);
        const isEntrance = (r === entranceR && c === entranceC);
        const isExit = (r === exitR && c === exitC);
        const inRing = isInDecisionRing(r, c);
        const v = board[r][c];
        const monster = monsterMap.get(r + ',' + c);

        let bg = 'var(--bg-dark)';
        let border = '0.5px solid var(--border-dark)';
        let content = '';
        let contentColor = '';

        if (firstMove && isEntrance) {
          bg = 'var(--bg-entrance-exit)';
          content = '↓'; contentColor = 'var(--color-entrance)';
          border = '1px solid #1D9E75';
        } else if (lit) {
          if (v === 'lava') {
            bg = walked[r][c] ? 'var(--bg-lit-lava-walked)' : 'var(--bg-lit-lava)';
            content = '🔥';
          } else if (v === 'pickaxe') {
            bg = 'var(--bg-pickaxe)';
            content = '⛏'; contentColor = 'var(--color-pickaxe)';
          } else {
            const lavaN = countLavaAround(r, c);
            bg = walked[r][c] ? 'var(--bg-lit-walked)' : 'var(--bg-lit-empty)';
            if (lavaN > 0) { content = lavaN; contentColor = 'var(--color-lava)'; }
            else { content = '0'; contentColor = 'var(--color-zero)'; }
          }
          // Exit indicator: shown on top of empty cells (lit), unless walked or flagged
          if (isExit && !walked[r][c] && v !== 'lava' && flags[r][c] === 0) {
            bg = 'var(--bg-entrance-exit)';
            content = '↓'; contentColor = 'var(--color-entrance)';
          }
          if (!walked[r][c] && flags[r][c] === 1) { content = '⚑'; contentColor = 'var(--color-flag)'; }
          else if (!walked[r][c] && flags[r][c] === 2) { content = '?'; contentColor = 'var(--color-question)'; }
          else if (!walked[r][c] && flags[r][c] === 3) { content = '✓'; contentColor = 'var(--color-check)'; }
        } else {
          if (flags[r][c] === 1) { content = '⚑'; contentColor = 'var(--color-flag-dark)'; }
          else if (flags[r][c] === 2) { content = '?'; contentColor = 'var(--color-question-dark)'; }
          else if (flags[r][c] === 3) { content = '✓'; contentColor = 'var(--color-check-dark)'; }
          if (isExit && flags[r][c] === 0) {
            bg = 'var(--bg-exit-dark)';
            content = '↓'; contentColor = '#E1F5EE';
          }
          if (v === 'pickaxe' && !lit) {
            content = '⛏'; contentColor = 'var(--color-pickaxe)';
          }
          if (gameOver && v === 'lava') { bg = 'var(--bg-lit-lava)'; content = '🔥'; }
        }

        if (inRing && !gameOver) border = '1.5px dashed var(--border-ring)';
        if (isExit && !walked[r][c] && !gameOver) border = '2px solid #1D9E75';
        if (isPlayer && !gameOver) border = '2px solid var(--border-player)';
        else if (canStep && !gameOver) border = '1.5px solid var(--border-ring)';

        cell.style.background = bg;
        cell.style.border = border;
        if (contentColor) {
          cell.innerHTML = '<span style="color: ' + contentColor + ';">' + content + '</span>';
        } else {
          cell.innerHTML = content;
        }
        if (monster && !gameOver) {
          const styles = {
            '4dir':   { bg: '#FBD8A6', fg: '#7A3D0B', icon: '✚', shape: 'square' },
            '8dir':   { bg: '#F7B6B5', fg: '#791F1F', icon: '✳', shape: 'circle' },
            'diag':   { bg: '#D9C5EE', fg: '#43166B', icon: '✕', shape: 'diamond' },
            'hidden': { bg: '#C8D6E6', fg: '#1F3957', icon: '◆', shape: 'circle' },
          };
          const s = styles[monster.type] || styles['4dir'];
          const dotSize = cellSize - 8;
          const radius = s.shape === 'circle' ? '50%' : (s.shape === 'diamond' ? '4px' : '3px');
          const transform = s.shape === 'diamond' ? 'rotate(45deg)' : 'none';
          const innerTransform = s.shape === 'diamond' ? 'rotate(-45deg)' : 'none';
          const opacity = monster.type === 'hidden' ? '0.78' : '1';
          // Alert overlay: red glow ring
          const alertRing = monster.alert
            ? 'box-shadow:0 0 0 2px #E24B4A, 0 0 6px #E24B4A;'
            : '';
          cell.innerHTML =
            '<span style="background:' + s.bg + ';width:' + dotSize + 'px;height:' + dotSize + 'px;display:inline-flex;align-items:center;justify-content:center;border-radius:' + radius + ';transform:' + transform + ';opacity:' + opacity + ';' + alertRing + '">' +
              '<span style="color:' + s.fg + ';font-size:' + iconSize + 'px;line-height:1;transform:' + innerTransform + ';">' + s.icon + '</span>' +
            '</span>';
        }
        if (canStep) cell.classList.add('can-step');
        cell.addEventListener('click', ((rr, cc) => () => {
          if (inputMode === 'flag') {
            cycleFlag(rr, cc);
          } else {
            step(rr, cc);
          }
        })(r, c));
        cell.addEventListener('contextmenu', ((rr, cc) => (e) => { e.preventDefault(); cycleFlag(rr, cc); })(r, c));
        grid.appendChild(cell);
      }
    }
    document.getElementById('objective').textContent = '步数 · ' + steps;
    const pickaxeEl = document.getElementById('pickaxe-status');
    if (currentLevel && currentLevel.hasPickaxe) {
      pickaxeEl.innerHTML = pickaxeOwned ? '<span class="pickaxe-owned">⛏ 已持有</span>' : '⛏ 待拾取';
    } else {
      pickaxeEl.textContent = '';
    }
  }

  // ============================================================
  // Level load / reset / back
  // ============================================================
  function loadLevel(id) {
    currentLevel = LEVELS.find(L => L.id === id);
    if (!currentLevel) return;
    ROWS = currentLevel.rows;
    COLS = currentLevel.cols;
    LAVA_COUNT = currentLevel.lava;
    document.getElementById('level-label').textContent = currentLevel.name;
    document.getElementById('level-select').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';
    updateLegend();
    resetLevel();
    // Show tutorial for this level if not seen yet
    const tut = TUTORIALS.find(t => t.levelId === id);
    if (tut && !hasSeenTutorial(tut.id)) {
      showTutorial(tut);
    }
  }

  function hasSeenTutorial(tutId) {
    try {
      const raw = localStorage.getItem('miner_tutorials_seen_v3');
      if (!raw) return false;
      const seen = JSON.parse(raw);
      return Array.isArray(seen) && seen.includes(tutId);
    } catch (e) { return false; }
  }
  function markTutorialSeen(tutId) {
    try {
      const raw = localStorage.getItem('miner_tutorials_seen_v3');
      const seen = raw ? JSON.parse(raw) : [];
      if (!seen.includes(tutId)) seen.push(tutId);
      localStorage.setItem('miner_tutorials_seen_v3', JSON.stringify(seen));
    } catch (e) {}
  }
  function showTutorial(tut) {
    document.getElementById('tutorial-title').textContent = tut.title;
    const itemsContainer = document.getElementById('tutorial-items');
    itemsContainer.innerHTML = '';
    for (const item of tut.items) {
      const div = document.createElement('div');
      div.className = 'tut-item';
      div.innerHTML =
        '<span class="tut-icon">' + item.icon + '</span>' +
        '<span class="tut-key">' + item.key + '</span>' +
        '<div class="tut-body">' + item.body + '</div>';
      itemsContainer.appendChild(div);
    }
    const overlay = document.getElementById('tutorial-overlay');
    overlay.dataset.tutId = tut.id;
    overlay.classList.add('show');
  }
  function resetLevel() {
    makeEmpty();
    generateMap();
    playerR = -1; playerC = -1;
    decisionR = -1; decisionC = -1;
    gameOver = false;
    firstMove = true;
    steps = 0;
    setMode('move');
    setStatus('点击顶部发光的入口进入。', 'secondary');
    render();
  }
  function backToSelect() {
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('level-select').style.display = 'block';
    renderLevelSelect();
  }
  function updateLegend() {
    const legend = document.getElementById('legend-text');
    let html = '<div>底部切换 <strong>🚶 移动</strong> / <strong>⚑ 标记</strong> 模式 · 桌面端右键可随时标记</div>';
    html += '<div style="margin-top:6px;">已照亮的格子显示真相 · <span style="color:var(--border-ring);">橙色虚线</span> = 决策圈 · 踩入暗格会照亮新的 3×3 区域</div>';
    if (currentLevel.monsters.length > 0) {
      const typeLabels = {
        '4dir':   '<span style="color:#7A3D0B;background:#FBD8A6;padding:0 6px;border-radius:3px;font-size:11px;">✚ 4 方向</span>',
        '8dir':   '<span style="color:#791F1F;background:#F7B6B5;padding:0 6px;border-radius:50%;font-size:11px;">✳ 8 方向</span>',
        'diag':   '<span style="color:#43166B;background:#D9C5EE;padding:0 6px;border-radius:3px;font-size:11px;">✕ 斜角</span>',
        'hidden': '<span style="color:#1F3957;background:#C8D6E6;padding:0 6px;border-radius:50%;font-size:11px;opacity:0.85;">◆ 隐身</span>',
      };
      const seen = new Set();
      const labels = [];
      for (const m of currentLevel.monsters) {
        if (seen.has(m.type)) continue;
        seen.add(m.type);
        labels.push(typeLabels[m.type]);
      }
      html += '<div style="margin-top:6px;">本关怪物：' + labels.join(' ') + ' · 你每动 1 步它也动 1 步 · 你靠近时会追你（红色光圈）· 不能踩岩浆</div>';
      if (currentLevel.monsters.some(m => m.type === 'hidden')) {
        html += '<div style="margin-top:4px;color:#C8D6E6;">隐身怪物只在你的亮区内可见，离开亮区会消失</div>';
      }
    }
    if (currentLevel.hasPickaxe) {
      html += '<div style="margin-top:6px;">地图上有 <span style="color:var(--color-pickaxe);">⛏ 镐子</span>，拾取后下次相邻碰怪物自动击杀（一次性）</div>';
    }
    legend.innerHTML = html;
  }

  // ============================================================
  // Wire up
  // ============================================================
  document.getElementById('back-btn').addEventListener('click', backToSelect);
  document.getElementById('reset-btn').addEventListener('click', resetLevel);

  function setMode(mode) {
    inputMode = mode;
    document.getElementById('mode-move-btn').classList.toggle('active', mode === 'move');
    document.getElementById('mode-flag-btn').classList.toggle('active', mode === 'flag');
  }
  document.getElementById('mode-move-btn').addEventListener('click', () => setMode('move'));
  document.getElementById('mode-flag-btn').addEventListener('click', () => setMode('flag'));
  document.getElementById('reset-progress-btn').addEventListener('click', () => {
    if (confirm('确定要清除所有通关进度吗？')) {
      try {
        localStorage.removeItem('miner_progress_v3');
        localStorage.removeItem('miner_tutorials_seen_v3');
        localStorage.removeItem('miner_tutorial_seen_v3'); // legacy key
      } catch (e) {}
      renderLevelSelect();
    }
  });
  document.getElementById('tutorial-close-btn').addEventListener('click', () => {
    const overlay = document.getElementById('tutorial-overlay');
    const tutId = overlay.dataset.tutId;
    overlay.classList.remove('show');
    if (tutId) markTutorialSeen(tutId);
  });

  // Re-render on viewport resize (rotation, window resize) — only if game screen is active
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (document.getElementById('game-screen').style.display === 'flex' && currentLevel) {
        render();
      }
    }, 150);
  });

  renderLevelSelect();
})();
</script>
